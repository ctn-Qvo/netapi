# 本工作流使用的操作未经 GitHub 认证。
# 它们由第三方提供，并受各自的服务条款、隐私政策和支持文档约束。
# 本工作流将使用 Gradle 构建 Java 项目，并缓存/恢复依赖项以优化执行时间。
# 更多信息请参阅：https://docs.github.com/zh/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: AllMusic 客户端

on:
  # 支持手动触发（在 GitHub Actions 页面点击“Run workflow”）
  workflow_dispatch:

  push:
    # 针对 branches 的匹配模式（只对 releases/ 开头的分支生效）
    branches:
      - 'releases/**'
    # 针对 tags 的匹配模式（所有标签）
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build_client:   # Job ID 保持原样，不变
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 构建
        shell: cmd
        run: |
          gradlew build

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: "netapi"
          path: build/
